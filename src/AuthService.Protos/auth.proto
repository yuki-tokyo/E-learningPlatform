syntax = "proto3";

option csharp_namespace = "AuthService.Protos";

package auth;

service AuthApi {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (JwtTokenResponse);
  rpc AddUser (AddUserRequest) returns (AddUserResponse);
}

// Requests
message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 2;
  string password = 3;
}

message AddUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

// Responses
message RegisterResponse {
  string msg = 1;
}

message JwtTokenResponse {
  string token = 1;
}

message AddUserResponse { }
