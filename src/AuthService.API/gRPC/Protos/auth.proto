syntax = "proto3";

option csharp_namespace = "AuthService.Protos";

package auth;

service AuthApi {
  rpc Register (RegisterRequest) returns (JwtTokenResponse);
  rpc Login (LoginRequest) returns (JwtTokenResponse);
}


message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 2;
  string password = 3;
}

message JwtTokenResponse {
  string token = 1;
}